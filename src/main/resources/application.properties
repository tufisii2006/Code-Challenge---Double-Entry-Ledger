spring.application.name=coremaker-ledger

springdoc.swagger-ui.urls[0].name=Accounts
springdoc.swagger-ui.urls[0].url=/openapi/account-api.yaml

springdoc.swagger-ui.urls[1].name=Transactions
springdoc.swagger-ui.urls[1].url=/openapi/transaction-api.yaml
springdoc.swagger-ui.urls-primary-name=Accounts

#Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ledger
spring.datasource.username=ledger
spring.datasource.password=ledger
spring.jpa.show-sql=true

#Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate

#Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

#RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=ledger
spring.rabbitmq.password=ledger
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false